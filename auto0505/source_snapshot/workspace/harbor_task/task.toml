schema_version = "1.3"
artifacts = [{ source = "/workspace/solution", destination = "solution" }]

[task]
name = "autoresearch/rfsteps"
version = "3.4.1"
description = "Optimize the timestep schedule of RF-Solver (rectified-flow inversion) under a frozen NFE budget to minimize inversion-reconstruction error (PSNR)."
authors = [{ name = "AutoResearch Expert" }]
keywords = ["rectified-flow", "diffusion-inversion", "timestep-schedule", "image-editing", "autoresearch"]

[metadata]
difficulty_explanation = "Method-level schedule design on a frozen 2nd-order RF-Solver; requires error-model reasoning, not hyperparameter search."
category = "generative-models"
paper = "arXiv:2411.04746"

[verifier]
timeout_sec = 3600.0
network_mode = "no-network"
environment_mode = "separate"

[verifier.environment]
cpus = 2
memory_mb = 2048
storage_mb = 8192
gpus = 0
gpu_types = []

[agent]
network_mode = "public"
timeout_sec = 43200.0

[environment]
os = "linux"
network_mode = "public"
gpus = 0
gpu_types = []
cpus = 2
memory_mb = 2048
storage_mb = 8192
build_timeout_sec = 3600.0

[environment.env]
RFSTEPS_GPU_EXECUTION = "external-controlled-A100"
